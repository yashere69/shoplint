[project]
name = "shoplint"
version = "0.2.0"
description = "Audit a Shopify product export against what AI shopping agents and product feeds need."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Sharma" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
shoplint = "shoplint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shoplint = ["packs/*.yaml", "questions/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
